<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leyton ESG — Mappa Clienti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <div id="upload-section">
    <!-- PROGRESS STEPS -->
    <div class="steps">
      <div class="step active" id="step-1">
        <div class="step-circle">1</div>
        <div class="step-label">Carica file</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step-2">
        <div class="step-circle">2</div>
        <div class="step-label">Seleziona BU</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step-3">
        <div class="step-circle">3</div>
        <div class="step-label">Genera</div>
      </div>
    </div>

    <!-- STEP 1: UPLOAD -->
    <div id="step-content-1" class="step-content">
      <div id="drop-zone">
        Trascina qui il file Excel oppure
        <label for="file-input">clicca per selezionare</label>
        <input type="file" id="file-input" accept=".xlsx,.xls" hidden>
      </div>
      <p id="upload-status"></p>
    </div>

    <!-- STEP 2: SELEZIONE BU -->
    <div id="step-content-2" class="step-content" style="display:none">
      <p class="step-subtitle">Seleziona la Business Unit da analizzare</p>
      <div id="bu-counts"></div>
      <div class="bu-buttons">
        <button class="bu-btn energy" onclick="selezionaBU('Energy')">Energy</button>
        <button class="bu-btn bp" onclick="selezionaBU('Business Performance')">Business Performance</button>
      </div>
    </div>

    <!-- STEP 3: GENERA -->
    <div id="step-content-3" class="step-content" style="display:none">
      <div id="step3-info"></div>
      <button id="btn-genera">Genera Mappa →</button>
    </div>

    <div id="bu-selection" style="display:none"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">

      <div class="card-header">
        <h1 class="card-title">I Nostri Clienti</h1>
        <div class="header-stripes"></div>
      </div>

      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Cerca per Partita IVA...">
        <button id="search-btn">🔍</button>
      </div>

      <div id="cambia-vista-wrap">
        <button class="btn-cambia-vista">← Cambia BU</button>
      </div>

      <div class="card-body">
        <div class="col-left">
          <div class="section-label">Dimensioni</div>
          <div id="dimensioni"></div>
          <div class="section-label" style="margin-top:28px">Settore</div>
          <div id="settore"></div>
        </div>
        <div class="col-right">
          <div class="section-label">Distribuzione</div>
          <div id="distribuzione"></div>
        </div>
      </div>

      <div class="card-footer">
        <div class="leyton-logo">
          LEYT<span class="logo-o">O</span>N
          <span class="logo-esg">ESG</span>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
